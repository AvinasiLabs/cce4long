name: Upload processed summary
description: Upload a processed summary file (processed/2024/q1/summary.json).
method: POST
url: http://localhost:3000/v1/datasets/:dataset_id/upload/:path
headers:
  - name: Content-Type
    value: application/octet-stream
  - name: Authorization
    value: Bearer $upload_token
body:
  content: '{"quarter":"Q1","avg_temp":23.5,"avg_humidity":65.4,"records":3}'
path_params:
  - name: dataset_id
    value: '0x4242424242424242424242424242424242424242'
  - name: path
    value: 'processed/2024/q1/summary.json'
