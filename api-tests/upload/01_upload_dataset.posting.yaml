name: Upload dataset
description: Upload raw data for a dataset. cced encrypts it and stores to the configured backend. Requires a valid upload token.
method: POST
url: http://localhost:3000/v1/datasets/:dataset_id/upload/:path
headers:
  - name: Content-Type
    value: application/octet-stream
  - name: Authorization
    value: Bearer $upload_token
body:
  content: "hello world from posting"
path_params:
  - name: dataset_id
    value: '0x4242424242424242424242424242424242424242'
  - name: path
    value: 'data.csv'
