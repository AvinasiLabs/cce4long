name: Upload deep dir humidity data
description: Upload a second sensor file to a deep path (raw/2024/01/sensors/humidity.csv).
method: POST
url: http://localhost:3000/v1/datasets/:dataset_id/upload/:path
headers:
  - name: Content-Type
    value: application/octet-stream
  - name: Authorization
    value: Bearer $upload_token
body:
  content: "ts,value\n1704067200,65.2\n1704070800,63.8\n1704074400,67.1"
path_params:
  - name: dataset_id
    value: '0x4242424242424242424242424242424242424242'
  - name: path
    value: 'raw/2024/01/sensors/humidity.csv'
