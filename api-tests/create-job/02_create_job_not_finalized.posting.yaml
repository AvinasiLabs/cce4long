name: Create job - dataset not finalized
description: |-
  Attempt to create a job for a dataset that has not been finalized.
  Expected: 403 Forbidden with { error: "dataset not finalized" }.
method: POST
url: http://localhost:3000/v1/jobs/create
headers:
  - name: Content-Type
    value: application/json
body:
  content: |-
    {
      "wallet_address": "$test_wallet",
      "dataset_ids": ["0x0000000000000000000000000000000000000000"],
      "job_spec": {},
      "signature": "$create_job_signature",
      "message": "$create_job_message"
    }
